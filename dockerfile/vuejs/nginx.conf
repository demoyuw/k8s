server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Built, hashed assets must 404 for real when missing, instead of
	# silently falling back to index.html.
	location /assets/ {
		try_files $uri =404;
	}

	# Vue Router uses HTML5 history mode, so any other path that doesn't
	# match a real file must fall back to index.html and let the
	# client-side router handle it.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
